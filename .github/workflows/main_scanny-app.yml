# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - scanny-app

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, linux, x64, box]
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: npm install, build, and test
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: Strip secret files before packaging
        run: |
          set -euo pipefail
          find . -path ./node_modules -prune -o -path ./.git -prune -o -type f \( \
            -name '.env' -o -name '*.pem' -o -name '*.key' -o -name '*.p12' -o -name '*.pfx' -o \
            -name '*.map' -o -name 'credentials.json' -o -name 'id_rsa' -o -name 'id_rsa.pub' \
          \) -exec rm -f {} +
          find . -path ./node_modules -prune -o -path ./.git -prune -o -type f -name '.env.*' ! -name '.env.example' -exec rm -f {} +
          rm -rf .git test

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          # Artefakten behövs bara de minuter deploy-jobbet hämtar den. 90
          # dagars default fyllde kontots delade lagringskvot och stoppade
          # bygget i ett annat repo.
          retention-days: 1
          include-hidden-files: false
          path: .

  deploy:
    runs-on: [self-hosted, linux, x64, box]
    needs: build
    # PR-körningar bygger och testar bara. Deploy endast från main.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_A49B204146224E4794854BDF7352A6CE }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_595C60434785406384C332D7B76EED97 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C911FC2225AF48D2B79AB52388F6079D }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'scanny-app'
          slot-name: 'Production'
          package: .
          