name: MongoDB Backup

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install mongodump
        run: |
          wget -qO - https://www.mongodb.org/static/pgp/server-6.0.asc | sudo apt-key add -
          echo "deb [ arch=amd64,arm64 ] https://repo.mongodb.org/apt/ubuntu focal/mongodb-org/6.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-6.0.list
          sudo apt-get update
          sudo apt-get install -y mongodb-database-tools

      - name: Run backup
        run: |
          # Cosmos DB (mongocluster.cosmos.azure.com:10260, northeurope) tappar
          # ibland SCRAM-SHA-256-handskakningen: "incomplete read of message
          # header: context deadline exceeded" / "i/o timeout". mongodump har
          # 3 sekunders --dialTimeout som standard, vilket är för kort för en
          # transatlantisk handskakning. Flera parallella anslutningar gör det
          # värre, så vi väntar 30 sekunder på uppkopplingen, dumpar en
          # kollektion i taget och försöker igen. En ofullständig arkivfil tas
          # bort före varje försök så att en omkörning inte laddar upp en
          # trasig dump.
          DATE=$(date +%Y-%m-%d)
          ARCHIVE="backup-$DATE.gz"
          MAX_ATTEMPTS=5
          attempt=1

          while [ "$attempt" -le "$MAX_ATTEMPTS" ]; do
            rm -f "$ARCHIVE"
            echo "mongodump attempt ${attempt}/${MAX_ATTEMPTS}"
            set +e
            mongodump \
              --uri="${{ secrets.MONGODB_URI }}" \
              --archive="$ARCHIVE" \
              --gzip \
              --numParallelCollections=1 \
              --dialTimeout=30
            status=$?
            set -e

            if [ "$status" -eq 0 ] && [ ! -s "$ARCHIVE" ]; then
              echo "mongodump exited 0 but ${ARCHIVE} is missing or empty"
              status=1
            fi

            if [ "$status" -eq 0 ]; then
              echo "mongodump succeeded on attempt ${attempt}"
              exit 0
            fi

            echo "mongodump failed on attempt ${attempt} (exit ${status})"
            rm -f "$ARCHIVE"
            if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
              echo "Giving up after ${MAX_ATTEMPTS} attempts"
              exit "$status"
            fi

            # 15s, 30s, 60s, 120s
            delay=$((15 << (attempt - 1)))
            echo "Waiting ${delay}s before retry"
            sleep "$delay"
            attempt=$((attempt + 1))
          done

          exit 1

      - name: Upload to Azure Blob Storage
        uses: azure/CLI@v2
        with:
          inlineScript: |
            DATE=$(date +%Y-%m-%d)
            az storage blob upload \
              --connection-string "${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" \
              --container-name backups \
              --name backup-$DATE.gz \
              --file backup-$DATE.gz \
              --overwrite=true
