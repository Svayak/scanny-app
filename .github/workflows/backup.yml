name: MongoDB Backup

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: [self-hosted, linux, x64, box]
    steps:
      - uses: actions/checkout@v4

      # mongodump och az är förinstallerade på box-runnern (~/.local/bin).
      - name: Check tools
        run: |
          mongodump --version | head -1
          az version --output tsv | head -1

      - name: Run backup
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          set -euo pipefail
          DATE=$(date +%Y-%m-%d)
          errfile=$(mktemp)
          set +e
          mongodump --uri="$MONGODB_URI" --archive="backup-$DATE.gz" --gzip --dialTimeout=30 --numParallelCollections=1 2>"$errfile"
          code=$?
          set -e
          node scripts/scrub-stream.js "$errfile" "$code"

      # azure/CLI@v2 kör az i en Docker-container; box-runnern har inte Docker,
      # så az (förinstallerad) körs direkt. Ingen az login behövs med connection string.
      - name: Upload to Azure Blob Storage
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        run: |
          set -euo pipefail
          DATE=$(date +%Y-%m-%d)
          az storage blob upload \
            --container-name backups \
            --name "backup-$DATE.gz" \
            --file "backup-$DATE.gz" \
            --only-show-errors

      # Self-hosted workspace återanvänds mellan körningar: radera dumpen lokalt.
      - name: Remove local dump
        if: always()
        run: rm -f backup-*.gz
