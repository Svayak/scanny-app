<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0c0f0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scanny">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>Scanny Kiosk</title>
<script>
(function () {
  var link = document.createElement('link');
  link.rel = 'manifest';
  link.href = '/manifest.webmanifest?start=' + encodeURIComponent(location.pathname + location.search);
  document.head.appendChild(link);
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js').catch(function () {});
    });
  }
})();
</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c0f0a;--surface:#141810;--surface2:#1c2118;
  --border:#2a3025;--border2:#3a4535;
  --text:#f0ede8;--text2:#9fa899;--text3:#6b7265;
  --accent:#4ade80;--accent-light:rgba(74,222,128,.12);--accent-dark:#16a34a;
  --warn:#fbbf24;--warn-light:rgba(251,191,36,.12);
  --danger:#f87171;--danger-light:rgba(248,113,113,.12);
  --radius:16px;--radius-lg:24px;
}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--text);user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input,select,textarea{font-size:16px}

body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");pointer-events:none;z-index:0;opacity:.35}

/* ── Skärmar ── */
.screen{display:none;height:100vh;height:100dvh;min-height:0;flex-direction:column}
.screen.active{display:flex}

/* ── Header ── */
.k-header{padding:20px 24px 0;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.k-brand{display:flex;align-items:center;gap:10px;font-size:26px;font-weight:800;color:var(--accent)}
.k-brand svg{width:28px;height:28px}
.k-status{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text3)}
.status-dot{width:9px;height:9px;border-radius:50%;background:#22c55e}
.status-dot.error{background:var(--danger)}
#screen-login{background:var(--bg);align-items:center;justify-content:center}
.login-box{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:40px 32px;width:100%;max-width:380px;text-align:center}
.login-logo{display:flex;align-items:center;justify-content:center;gap:10px;font-size:24px;font-weight:800;color:var(--accent);margin-bottom:8px}
.login-sub{font-size:14px;color:var(--text3);margin-bottom:28px}
.login-field{display:flex;flex-direction:column;gap:6px;text-align:left;margin-bottom:16px}
.login-field label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text3)}
.login-field input{padding:12px 14px;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;color:var(--text);font-size:15px;outline:none;transition:border-color .2s;font-family:inherit}
.login-field input:focus{border-color:var(--accent)}
.login-btn{width:100%;padding:14px;background:var(--accent);color:#0c0f0a;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;margin-top:8px;font-family:inherit;transition:background .2s}
.login-btn:hover{background:var(--accent-dark)}
.login-error{font-size:13px;color:var(--danger);margin-top:12px;min-height:20px}


/* ════════════════════
   VÄLJ ANVÄNDARE
   ════════════════════ */
#screen-users{background:var(--bg)}
.users-title{text-align:center;font-size:20px;font-weight:600;color:var(--text2);padding:20px 24px 8px}
.users-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:14px;
  padding:16px 24px 24px;
  overflow-y:auto;
  flex:1;
  align-content:start;
}
.user-card{
  background:var(--surface);border:2px solid var(--border);border-radius:var(--radius-lg);
  padding:20px 16px;display:flex;flex-direction:row;align-items:center;gap:16px;
  cursor:pointer;transition:all .15s;
  min-height:88px;
}
.user-card:hover{border-color:var(--accent);box-shadow:0 4px 20px rgba(74,222,128,.08);transform:translateY(-2px)}
.user-card:active{transform:scale(.97)}
.user-avatar{
  width:52px;height:52px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:700;color:#fff;flex-shrink:0;
}
.user-name{font-size:15px;font-weight:600;text-align:left;line-height:1.3}
.no-users{text-align:center;color:var(--text3);padding:3rem;font-size:15px;grid-column:1/-1}

/* ════════════════════
   SKANNA (huvud-skärm)
   ════════════════════ */
#screen-scan{background:var(--bg)}
.scan-layout{
  display:grid;
  grid-template-rows:auto minmax(0,1fr) auto auto;
  height:100vh;
  height:100dvh;
  min-height:0;
  padding:20px 24px 24px;
  gap:16px;
}
.scan-stage{
  display:flex;flex-direction:column;gap:12px;
  min-height:0;overflow:hidden;
}

/* Användarrad */
.user-bar{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:10px 16px;
}
.user-bar-left{display:flex;align-items:center;gap:10px}
.user-bar-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0}
.user-bar-name{font-size:14px;font-weight:600}
.user-bar-role{font-size:12px;color:var(--text3);margin-top:1px}
.logout-btn{min-height:48px;padding:12px 18px;font-size:16px;font-weight:700;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface2);color:var(--text2);cursor:pointer;transition:all .12s}
.logout-btn:hover{border-color:rgba(248,113,113,.4);color:var(--danger)}

/* Feedback-kort */
.feedback-card{
  background:var(--surface);border:3px solid var(--border);border-radius:var(--radius-lg);
  padding:28px 32px;text-align:center;transition:border-color .2s,background .2s;
  display:flex;flex-direction:column;align-items:center;justify-content:center;justify-content:safe center;gap:10px;
  flex:1 1 auto;min-height:0;width:100%;overflow:hidden;
}
.feedback-card.ok{background:rgba(74,222,128,.08);border-color:rgba(74,222,128,.4);animation:scan-flash .18s ease}
.feedback-card.warn{background:rgba(251,191,36,.08);border-color:rgba(251,191,36,.4)}
.feedback-card.err{background:rgba(248,113,113,.08);border-color:rgba(248,113,113,.4);animation:scan-shake .28s ease}
.feedback-card.pending{background:var(--surface2);border-color:var(--border2)}
@keyframes scan-flash{from{transform:scale(.985)}to{transform:none}}
@keyframes scan-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.feedback-icon{font-size:52px;line-height:1}
.feedback-name{font-size:28px;font-weight:700}
.feedback-qty{font-size:60px;font-weight:800;line-height:1}
.feedback-qty.ok{color:var(--accent)}.feedback-qty.warn{color:var(--warn)}.feedback-qty.danger{color:var(--danger)}
.feedback-qty-label{font-size:16px;color:var(--text2)}
.feedback-msg{font-size:16px;color:var(--text2);margin-top:2px}
.feedback-card{container-type:size;container-name:feedback}
.idle-icon-wrap{width:72px;flex:0 1 72px;min-height:0;min-width:0;max-height:72px;max-width:72px;aspect-ratio:1;border-radius:50%;background:#f0ede8;display:flex;align-items:center;justify-content:center;margin:0;overflow:hidden}
.idle-icon-wrap svg{width:36px;height:36px;max-width:50%;max-height:50%}
.idle-text,.idle-hint,.feedback-name,.feedback-msg,.feedback-qty-label{flex:0 0 auto;max-width:100%}
.feedback-icon,.feedback-qty{flex:0 1 auto;min-height:0}
.idle-text{font-size:20px;font-weight:600;color:var(--text3)}
.idle-hint{font-size:14px;color:var(--text3);margin-top:4px}

/* Inv-panel */
.inv-panel{background:var(--surface);border:2px solid rgba(167,139,250,.4);border-radius:var(--radius-lg);padding:20px 24px;flex:0 1 auto;min-height:0;max-height:min(40dvh,42%);overflow-y:auto}
.inv-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.inv-title{font-size:16px;font-weight:700;color:#a78bfa}
.inv-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.inv-row:last-child{border-bottom:none}
.inv-name{font-size:13px;font-weight:500}
.inv-diff{font-size:12px;margin-top:2px}
.inv-diff.pos{color:var(--accent)}.inv-diff.neg{color:var(--danger)}.inv-diff.zero{color:var(--text3)}
.inv-count{font-size:26px;font-weight:700}
.inv-actions{display:flex;gap:10px;margin-top:14px}

/* Lägesväljare */
.mode-section{}
.mode-bar{display:flex;gap:12px}
.mode-btn{
  flex:1;padding:16px 12px;min-height:76px;font-size:17px;font-weight:700;border-radius:var(--radius);
  border:3px solid var(--border);background:var(--surface);color:var(--text2);
  cursor:pointer;transition:all .15s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
}
.mode-btn .mode-icon{font-size:28px}
.mode-btn:active{transform:scale(.97)}
.mode-btn.mode-out.active{background:rgba(248,113,113,.12);border-color:rgba(248,113,113,.5);color:#f87171}
.mode-btn.mode-add.active{background:rgba(74,222,128,.12);border-color:rgba(74,222,128,.5);color:var(--accent)}
.mode-btn.mode-inv.active{background:rgba(167,139,250,.12);border-color:rgba(167,139,250,.5);color:#a78bfa}
.mode-btn.disabled{opacity:.35;cursor:not-allowed;pointer-events:none}
.mode-indicator{height:5px;border-radius:3px;margin-top:10px;transition:background .2s}
.mode-section.timer-on .mode-indicator{display:none}
.mode-indicator.out{background:#f87171}
.mode-indicator.add{background:var(--accent)}
.mode-indicator.inv{background:#a78bfa}

/* Timer */
.timer-bar-wrap{display:none;margin-top:8px;background:var(--border);border-radius:3px;height:5px;overflow:hidden}
.timer-bar-wrap.visible{display:block}
.timer-bar{height:100%;border-radius:3px;background:#22C55E;transition:width 1s linear,background .5s;width:100%}
.timer-label{display:none;text-align:center;font-size:12px;font-weight:600;color:var(--text3);margin-top:5px}
.timer-label.visible{display:block}
.timer-label.urgent{color:var(--danger)}

/* ── Knappar ── */
.btn{min-height:48px;padding:12px 20px;font-size:16px;font-weight:600;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface2);color:var(--text);cursor:pointer;transition:all .12s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:#0c0f0a;border-color:var(--accent);font-weight:700}
.btn-primary:hover{background:#22c55e}
.btn-danger{border-color:rgba(248,113,113,.4);color:var(--danger);background:rgba(248,113,113,.08)}

/* ── Skanningsfält: synligt men utan skärmtangentbord (inputmode=none) ── */
.scan-entry{display:flex;gap:10px;align-items:stretch}
.barcode-input{
  position:relative;flex:1;width:100%;min-height:56px;opacity:1;
  font-size:20px;text-align:center;letter-spacing:1px;padding:12px 14px;
  border:2px solid var(--border);border-radius:var(--radius);background:var(--surface2);color:var(--text);
  caret-color:transparent;outline:none;user-select:text;-webkit-user-select:text;
}
.barcode-input:focus{border-color:var(--accent)}
.barcode-input.manual-keyboard{caret-color:auto;border-color:var(--accent)}
.barcode-input::placeholder{color:var(--text3);letter-spacing:0}
.keyboard-toggle{
  min-width:132px;min-height:56px;padding:12px 14px;font-size:16px;font-weight:700;
  border-radius:var(--radius);border:2px solid var(--border);background:var(--surface2);color:var(--text2);cursor:pointer;
}
.keyboard-toggle.active{border-color:var(--accent);color:var(--accent)}

/* ════════════════════
   MODAL (reg-nr + okänd)
   ════════════════════ */
.pin-key{font-size:24px;font-weight:700;padding:18px 0;min-height:56px}
.pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--text3);display:inline-block}
.pin-dot.filled{background:var(--accent);border-color:var(--accent)}
.modal-overlay{position:fixed;left:0;right:0;top:var(--vv-top,0px);height:var(--vv-height,100dvh);box-sizing:border-box;background:rgba(0,0,0,.7);z-index:200;display:none;align-items:center;justify-content:center;padding:8px;overflow:hidden;backdrop-filter:blur(6px)}
.modal-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);width:100%;max-width:520px;min-width:0;max-height:100%;min-height:0;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.6);animation:modal-in .18s ease}
@keyframes modal-in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.modal-body{overflow-y:auto;min-height:0;flex:1 1 auto;padding:24px 24px 8px;-webkit-overflow-scrolling:touch}
.modal-title{font-size:22px;font-weight:700;margin-bottom:6px}
.modal-subtitle{font-size:14px;color:var(--text2);margin-bottom:20px}
.form-group{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:0}
.form-group label{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.04em}
.form-group input{width:100%;min-width:0;box-sizing:border-box;padding:10px 12px;font-size:16px;border:1.5px solid var(--border);border-radius:var(--radius);background:var(--surface2);color:var(--text);outline:none;transition:border-color .15s}
.form-group input:focus{border-color:var(--accent)}
.form-group input::placeholder{color:var(--text3)}
.modal-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;min-width:0}
.modal-grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;min-width:0}
.modal-actions{position:sticky;bottom:0;z-index:1;flex:0 0 auto;display:flex;gap:10px;margin:0;padding:12px 24px 16px;background:var(--surface)}
@media (max-width:560px){
  .modal-grid,.modal-grid-3{grid-template-columns:minmax(0,1fr)}
}

/* Fordonslista */
.vehicle-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;max-height:260px;overflow-y:auto}
.vehicle-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--radius);
  cursor:pointer;transition:all .12s;background:var(--surface2);
}
.vehicle-item:hover{border-color:var(--accent);background:rgba(74,222,128,.06)}
.vehicle-item.last-used{border-color:var(--accent);background:rgba(74,222,128,.08)}
.vehicle-reg{font-size:18px;font-weight:700;letter-spacing:1px;color:var(--text)}
.vehicle-info{font-size:12px;color:var(--text2);margin-top:2px}
.vehicle-customer{font-size:12px;color:var(--text3)}
.no-vehicle-btn{width:100%;min-height:52px;padding:14px;border:1.5px dashed var(--border);border-radius:var(--radius);background:none;font-size:16px;color:var(--text3);cursor:pointer;transition:all .12s;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.no-vehicle-btn:hover{border-color:var(--text3);color:var(--text2)}

/* Kort skärmhöjd (surfplatta liggande): krymp ikon, luft och text så titel och underrad får plats. */
@media (max-height:700px){
  .scan-layout{padding:10px 16px 12px;gap:10px}
  .scan-stage{gap:8px}
  .user-bar{padding:6px 12px}
  .logout-btn{min-height:44px;padding:8px 14px;font-size:15px}
  .feedback-card{padding:10px 16px;gap:4px}
  .idle-icon-wrap{width:44px;flex-basis:44px;max-height:44px;max-width:44px}
  .idle-text{font-size:16px}
  .idle-hint{font-size:13px;margin-top:0}
  .feedback-icon{font-size:32px}
  .feedback-name{font-size:20px}
  .feedback-qty{font-size:36px}
  .feedback-qty-label,.feedback-msg{font-size:14px}
  .barcode-input,.keyboard-toggle{min-height:48px;padding:8px 12px}
  .mode-btn{min-height:60px;padding:8px;font-size:15px;gap:2px}
  .mode-btn .mode-icon{font-size:22px}
  .mode-indicator{margin-top:6px}
  .inv-panel{padding:10px 12px}
  .inv-actions{margin-top:8px}
}
@media (max-height:560px){
  .scan-layout{padding:8px 12px;gap:6px}
  .scan-stage{gap:6px}
  .feedback-card{padding:6px 12px;gap:2px}
  .idle-icon-wrap{width:32px;flex-basis:32px;max-height:32px;max-width:32px}
  .idle-text{font-size:15px}
  .idle-hint{font-size:12px}
  .feedback-icon{font-size:24px}
  .feedback-name{font-size:16px}
  .feedback-qty{font-size:28px}
  .feedback-qty-label,.feedback-msg{font-size:13px}
  .barcode-input,.keyboard-toggle{min-height:44px}
  .mode-btn{min-height:48px;padding:4px 6px;font-size:14px}
  .mode-btn .mode-icon{font-size:16px}
  .mode-indicator{margin-top:4px}
  .timer-bar-wrap{margin-top:4px}
  .timer-label{margin-top:2px;font-size:11px}
}
@container feedback (max-height:140px){
  .idle-icon-wrap,.feedback-icon{flex-basis:0;max-height:0;max-width:0;width:0;margin:0;padding:0;border:0;overflow:hidden;visibility:hidden}
  .feedback-qty{font-size:22px}
}
</style>
</head>
<body>

<!-- ════════════════════════════════
     SKÄRM 1: Välj användare
     ════════════════════════════════ -->
<div class="screen active" id="screen-login">
  <div style="display:flex;align-items:center;justify-content:center;height:100vh">
    <div style="background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:40px 32px;width:100%;max-width:380px;text-align:center">
      <div style="display:flex;align-items:center;justify-content:center;gap:10px;font-size:24px;font-weight:800;color:var(--accent);margin-bottom:8px">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="3" height="12" rx="0.5" fill="#4ade80"/><rect x="7.5" y="3" width="1.5" height="12" rx="0.5" fill="#4ade80" opacity=".6"/><rect x="10.5" y="3" width="2" height="12" rx="0.5" fill="#4ade80" opacity=".8"/></svg>
        Scanny Kiosk
      </div>
      <p style="font-size:14px;color:var(--text3);margin-bottom:28px">Logga in för att komma åt kiosken</p>
      <div style="display:flex;flex-direction:column;gap:6px;text-align:left;margin-bottom:16px">
        <label style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text3)">E-post</label>
        <input type="email" id="kiosk-email" placeholder="admin@verkstad.se" autocomplete="email" style="padding:12px 14px;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;color:var(--text);font-size:16px;outline:none;font-family:inherit">
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;text-align:left;margin-bottom:16px">
        <label style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text3)">Lösenord</label>
        <input type="password" id="kiosk-password" placeholder="••••••••" autocomplete="current-password" style="padding:12px 14px;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;color:var(--text);font-size:16px;outline:none;font-family:inherit">
      </div>
      <button type="button" onclick="kioskLogin()" style="width:100%;min-height:52px;padding:14px;background:var(--accent);color:#0c0f0a;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;margin-top:8px;font-family:inherit">Logga in</button>
      <div id="login-error" style="font-size:13px;color:var(--danger);margin-top:12px;min-height:20px"></div>
    </div>
  </div>
</div>
<div class="screen" id="screen-users">
  <div class="k-header">
    <div class="k-brand">
      <svg viewBox="0 0 24 24" fill="none">
        <rect x="3" y="3" width="3" height="12" rx="0.5" fill="currentColor" opacity=".9"/>
        <rect x="7.5" y="3" width="1.5" height="12" rx="0.5" fill="currentColor" opacity=".6"/>

<script>
// ═══════════════════════════════════════════
//  Scanny Kiosk — med användare & fordon
// ═══════════════════════════════════════════

let db = { products: [], users: [], vehicles: [], settings: {} };
let currentUser    = null;
let currentVehicle = null;  // { id, regNr, ... } eller null
let currentMode    = 'out';
let inventory      = {};
let scanWedge      = null;
let scanFeedbackGen = 0;
const scanDedupe = (window.ScannyScan ? ScannyScan.createScanDedupe(ScannyScan.SCAN_DEDUPE_MS) : { accept: () => true });
const scanQueue = (window.ScannyScan ? ScannyScan.createScanQueue() : { enqueue: (_c, task) => task() });
const pendingQty = (window.ScannyScan ? ScannyScan.createPendingQty() : { get: () => 0, preview: () => ({ status: 'unknown' }), settle() {} });

const AUTO_RESET_MS   = 10 * 60 * 1000;
const LOGOUT_IDLE_MS  = 10 * 60 * 1000;

let autoResetTimer  = null;
let logoutTimer     = null;
let timerInterval   = null;
let timerSecondsLeft = 0;

// ── Ljud ──
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function getAudioCtx() { if (!audioCtx) audioCtx = new AudioCtx(); return audioCtx; }
function playTone(freq, dur, type='sine', vol=0.25) {
  try {
    const ctx = getAudioCtx(), osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = type; osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    osc.start(ctx.currentTime); osc.stop(ctx.currentTime + dur);
  } catch(e) {}
}
function soundSuccess()  { playTone(880,.12,'sine',.22); setTimeout(()=>playTone(1100,.18,'sine',.18),100); }
function soundWarning()  { playTone(440,.25,'triangle',.28); }
function soundError()    { playTone(200,.18,'sawtooth',.28); setTimeout(()=>playTone(160,.28,'sawtooth',.28),160); }
function soundCritical() { playTone(300,.15,'square',.32); setTimeout(()=>playTone(250,.15,'square',.32),180); setTimeout(()=>playTone(200,.25,'square',.32),360); }

function getInitials(name) {
  if (!name) return '?';
  const parts = name.trim().split(/\s+/);
  if (parts.length >= 2) return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
  return parts[0].substring(0, 2).toUpperCase();
}

// ── Kiosk slug & token ──
const kioskSlug = window.location.pathname.split('/kiosk/')[1] || '';

const KIOSK_TOKEN_KEY = 'scanny_kiosk_token_' + kioskSlug;
const KIOSK_TOKEN_EXP = 'scanny_kiosk_exp_' + kioskSlug;
const THIRTY_DAYS = 30 * 24 * 60 * 60 * 1000;

async function kioskLogin() {
  const email = document.getElementById('kiosk-email').value.trim();
  const password = document.getElementById('kiosk-password').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  if (!email || !password) { errEl.textContent = 'Fyll i e-post och lösenord.'; return; }
  try {
    const res = await fetch('/api/auth/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({email, password}) });
    const data = await res.json();
    if (!res.ok) { errEl.textContent = data.error || 'Fel e-post eller lösenord.'; return; }
    if (data.tenant?.slug !== kioskSlug) { errEl.textContent = 'Kontot har inte åtkomst till denna kiosk.'; return; }
    localStorage.setItem(KIOSK_TOKEN_KEY, data.token);
    localStorage.setItem(KIOSK_TOKEN_EXP, Date.now() + THIRTY_DAYS);
    checkKioskAuth();
  } catch(err) { errEl.textContent = 'Anslutningsfel, försök igen.'; }
}

function checkKioskAuth() {
  const token = localStorage.getItem(KIOSK_TOKEN_KEY);
  const exp = localStorage.getItem(KIOSK_TOKEN_EXP);
  if (token && exp && Date.now() < parseInt(exp)) { showScreen('screen-users'); initKiosk(); }
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('kiosk-email')?.addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('kiosk-password').focus(); });
  document.getElementById('kiosk-password')?.addEventListener('keydown', e => { if(e.key==='Enter') kioskLogin(); });
});

let kioskToken  = localStorage.getItem('kiosk_token_' + kioskSlug) || '';
let userToken   = ''; // användarspecifik token, sätts när en användare väljs

async function initKiosk() {
  if (!kioskSlug) {
    document.body.innerHTML = '<div style="display:flex;height:100vh;align-items:center;justify-content:center;font-size:18px;color:#f87171;font-family:sans-serif">Ingen verkstad angiven.<br>Använd URL: /kiosk/verkstadens-namn</div>';
    return;
  }
  // Hämta token om vi inte har en
  if (!kioskToken) {
    try {
      const res = await fetch('/api/kiosk/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ slug: kioskSlug })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      kioskToken = data.token;
      localStorage.setItem('kiosk_token_' + kioskSlug, kioskToken);
    } catch(err) {
      document.body.innerHTML = '<div style="display:flex;height:100vh;align-items:center;justify-content:center;font-size:18px;color:#f87171;font-family:sans-serif">' + err.message + '</div>';
      return;
    }
  }
  await loadDb();
}

// ── API ──
async function api(method, path, body) {
  const headers = {};
  if (body) headers['Content-Type'] = 'application/json';
  const tok = userToken || kioskToken; // användartoken när en användare valts, annars device-token
  if (tok) headers['Authorization'] = 'Bearer ' + tok;
  const res = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  if (res.status === 401) {
    localStorage.removeItem('kiosk_token_' + kioskSlug);
    location.reload();
    return;
  }
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Serverfel');
  return data;
}
async function loadDb() {
  try {
    db = await api('GET','/api/db');
    if (db.vehicles) db.vehicles.forEach(v => { if (!v.id) v.id = v._id; });
    if (db.products) db.products.forEach(p => { if (!p.id) p.id = p._id; });
    if (db.users) db.users.forEach(u => { if (!u.id) u.id = u._id; });
    setStatus(true);
    renderUserGrid();
    refreshCurrentUser();
  }
  catch(_) { setStatus(false); }
}

function refreshCurrentUser() {
  if (!currentUser || !db.users) return;
  const fresh = db.users.find(u => String(u.id) === String(currentUser.id));
  if (!fresh) return;
  currentUser = fresh;
  const av = document.getElementById('bar-avatar');
  if (av) {
    av.style.background = fresh.color || '#0f6e56';
    av.textContent = getInitials(fresh.name);
  }
  const nameEl = document.getElementById('bar-name');
  if (nameEl) nameEl.textContent = fresh.name;
  applyPermissions(fresh);
}

// Uppdatera en produkt lokalt från serverns svar — undviker full omladdning vid varje skanning.
function applyProductUpdate(p) {
  if (!p || !db.products) return;
  const key = p.id || p._id;
  let idx = db.products.findIndex(x => x.id === key || x._id === key);
  if (idx < 0 && p.code) idx = db.products.findIndex(x => x.code === p.code);
  if (idx >= 0) { const eid = db.products[idx].id; db.products[idx] = { ...db.products[idx], ...p, id: eid }; }
}
// Full synk körs en gång när skanningen lugnat sig.
let _syncTimer = null;
function scheduleSync(delay = 900) { clearTimeout(_syncTimer); _syncTimer = setTimeout(() => { loadDb(); }, delay); }
function setStatus(ok) {
  const dot = document.getElementById('k-status-dot'), txt = document.getElementById('k-status-text');
  if (dot) dot.className = 'status-dot'+(ok?'':' error');
  if (txt) txt.textContent = ok?'Ansluten':'Offline';
}

// ── Skärmbyte ──
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if (id !== 'screen-scan' && scanWedge) scanWedge.clear();
}

// ════════════════════════════════
//  ANVÄNDARGRID
// ════════════════════════════════
function renderUserGrid() {
  const grid = document.getElementById('users-grid');
  const users = db.users || [];
  if (users.length === 0) {
    grid.innerHTML = '<div class="no-users">Inga användare tillagda ännu.<br>Lägg till användare i Admin-panelen.</div>';
    return;
  }
  grid.innerHTML = users.map(u => `
    <div class="user-card" onclick="selectUser('${u.id}')">
      <div class="user-avatar" style="background:${u.color || '#0f6e56'}">${getInitials(u.name)}</div>
      <div class="user-name">${esc(u.name)}</div>
    </div>`).join('');
}

function selectUser(userId) {
  const u = db.users.find(x => x.id === userId);
  if (!u) return;
  if (u.hasPin) { openPinModal(userId); return; }
  proceedSelectUser(userId, null);
}

// ── PIN-inmatning ──
let pinState = { userId: null, digits: '' };
function openPinModal(userId) {
  const u = db.users.find(x => x.id === userId);
  pinState = { userId, digits: '' };
  document.getElementById('pin-user-name').textContent = u ? u.name : '';
  document.getElementById('pin-error').textContent = '';
  renderPinDots();
  document.getElementById('pin-modal').style.display = 'flex';
}
function closePinModal() {
  document.getElementById('pin-modal').style.display = 'none';
  pinState = { userId: null, digits: '' };
}
function renderPinDots() {
  const dots = [0,1,2,3].map(i => `<span class="pin-dot${i < pinState.digits.length ? ' filled' : ''}"></span>`).join('');
  document.getElementById('pin-dots').innerHTML = dots;
}
function showPinError(msg) {
  document.getElementById('pin-error').textContent = msg;
  pinState.digits = '';
  renderPinDots();
}
function pinPress(d) {
  if (pinState.digits.length >= 4) return;
  pinState.digits += d;
  document.getElementById('pin-error').textContent = '';
  renderPinDots();
  if (pinState.digits.length === 4) {
    const uid = pinState.userId, pin = pinState.digits;
    setTimeout(() => proceedSelectUser(uid, pin), 120);
  }
}
function pinBackspace() {
  pinState.digits = pinState.digits.slice(0, -1);
  renderPinDots();
}

async function proceedSelectUser(userId, pin) {
  try {
    const users = await api('GET', '/api/users');
    if (Array.isArray(users)) {
      db.users = users;
      db.users.forEach(u => { if (!u.id) u.id = u._id; });
      renderUserGrid();
    }
  } catch (_) {}
  const u = (db.users || []).find(x => String(x.id) === String(userId));
  if (!u) return;
  // Byt device-token mot en användarspecifik token — agerande användare bäddas in server-side
  try {
    const res = await fetch('/api/kiosk/user-token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + kioskToken },
      body: JSON.stringify({ userId, pin })
    });
    const data = await res.json();
    if (!res.ok) {
      if (data.needPin) { showPinError(data.error || 'Fel PIN'); return; }
      throw new Error(data.error || 'Kunde inte logga in användaren');
    }
    userToken = data.token;
  } catch (err) {
    alert('Kunde inte välja användare: ' + err.message);
    return;
  }
  closePinModal();
  currentUser    = u;
  currentVehicle = null;

  // Uppdatera användarrad
  const av = document.getElementById('bar-avatar');
  av.style.background = u.color || '#0f6e56';
  av.textContent = getInitials(u.name);
  document.getElementById('bar-name').textContent = u.name;
  updateVehicleBar();

  // Sätt behörigheter på knappar
  applyPermissions(u);

  // Gå till scan-skärmen
  showScreen('screen-scan');
  setMode('out');
  startLogoutTimer();
  focusInput();

  // Om användaren har Uttag — visa fordonspicker direkt
  if (canDo(u, 'scan')) {
    showVehicleModal();
  }
}

// Läser behörighet, stödjer både nya (canScan) och gamla (scan) fältnamn.
// Blockerar endast om behörigheten explicit satts till false.
function canDo(u, key) {
  const p = u.permissions || {};
  const map = { scan: p.canScan ?? p.scan, add: p.canAdd ?? p.add, inventory: p.canInventory ?? p.inventory };
  return map[key] !== false;
}

function applyPermissions(u) {
  const btnOut = document.getElementById('btn-out');
  const btnAdd = document.getElementById('btn-add');
  const btnInv = document.getElementById('btn-inv');
  if (btnOut) btnOut.classList.toggle('disabled', !canDo(u, 'scan'));
  if (btnAdd) btnAdd.classList.toggle('disabled', !canDo(u, 'add'));
  if (btnInv) btnInv.classList.toggle('disabled', !canDo(u, 'inventory'));
}

function updateVehicleBar() {
  const el = document.getElementById('bar-vehicle');
  if (!el) return;
  el.textContent = currentVehicle ? '🚗 ' + currentVehicle.regNr + (currentVehicle.make ? ' — ' + currentVehicle.make + ' ' + currentVehicle.model : '') : 'Inget fordon valt';
}

// ════════════════════════════════
//  FORDONSPICKER
// ════════════════════════════════
function showVehicleModal() {
  filterVehicles();
  document.getElementById('vehicle-search').value = '';
  document.getElementById('vehicle-modal').style.display = 'flex';
}

function filterVehicles() {
  const q = (document.getElementById('vehicle-search')?.value || '').toUpperCase().trim();
  const vehicles = (db.vehicles || []).filter(v => !v.archived);
  const filtered = q ? vehicles.filter(v => v.regNr.includes(q) || (v.customerName||'').toUpperCase().includes(q)) : vehicles;
  const lastUsedId = currentUser?.lastVehicleId;
  const list = document.getElementById('vehicle-list');
  if (!list) return;
  if (filtered.length === 0) {
    list.innerHTML = '<div style="text-align:center;color:var(--text3);padding:1rem;font-size:14px">Inga fordon hittades</div>';
    return;
  }
  list.innerHTML = filtered.map(v => `
    <div class="vehicle-item ${v.id === lastUsedId ? 'last-used' : ''}" onclick="selectVehicle('${v.id}')">
      <div>
        <div class="vehicle-reg">${esc(v.regNr)}</div>
        <div class="vehicle-info">${esc([v.make, v.model, v.color].filter(Boolean).join(' '))}</div>
        <div class="vehicle-customer">${esc(v.customerName || '')}</div>
      </div>
      ${v.id === lastUsedId ? '<span style="font-size:12px;color:var(--accent);font-weight:600">Senast använd</span>' : ''}
    </div>`).join('');
}

async function selectVehicle(vehicleId) {
  document.getElementById('vehicle-modal').style.display = 'none';
  if (vehicleId) {
    currentVehicle = db.vehicles.find(v => v.id === vehicleId) || null;
    // Spara senast använda fordon på användaren
    if (currentUser) {
      currentUser.lastVehicleId = vehicleId;
      try { await api('PATCH', '/api/kiosk/users/' + currentUser.id + '/last-vehicle', { lastVehicleId: vehicleId }); } catch(_) {}
    }
  } else {
    currentVehicle = null;
  }
  updateVehicleBar();
  focusInput();
}

// ════════════════════════════════
//  LOGOUT & TIMERS
// ════════════════════════════════
function logout() {
  currentUser    = null;
  currentVehicle = null;
  userToken      = ''; // rensa användartoken, återgå till device-token
  inventory      = {};
  clearTimeout(autoResetTimer);
  clearTimeout(logoutTimer);
  clearInterval(timerInterval);
  hideTimer();
  showScreen('screen-users');
  setMode('out');
}

function startLogoutTimer() {
  clearTimeout(logoutTimer);
  logoutTimer = setTimeout(() => { logout(); }, LOGOUT_IDLE_MS);
}

function resetLogoutTimer() {
  startLogoutTimer();
}

const modeCountdown = (window.ScannyTimer ? ScannyTimer.createCountdown() : null);
function startAutoReset() {
  clearTimeout(autoResetTimer);
  clearInterval(timerInterval);
  timerInterval = null;
  if (modeCountdown) modeCountdown.stop();
  timerSecondsLeft = AUTO_RESET_MS / 1000;
  showTimer();
  const expire = () => {
    if (currentMode === 'add') {
      setMode('out');
      showFeedback('warn','⏱','Läget återställt','Tillbaka till Uttag',null);
    } else hideTimer();
  };
  if (modeCountdown) {
    modeCountdown.start(AUTO_RESET_MS, (left) => {
      timerSecondsLeft = left;
      updateTimerDisplay();
    }, expire);
    return;
  }
  timerInterval = setInterval(() => {
    timerSecondsLeft--;
    updateTimerDisplay();
    if (timerSecondsLeft <= 0) {
      clearInterval(timerInterval);
      timerInterval = null;
      expire();
    }
  }, 1000);
}

function showTimer() {
  document.querySelector('.mode-section')?.classList.add('timer-on');
  document.getElementById('timer-bar-wrap')?.classList.add('visible');
  document.getElementById('timer-label')?.classList.add('visible');
  updateTimerDisplay();
}
function hideTimer() {
  if (modeCountdown) modeCountdown.stop();
  clearInterval(timerInterval);
  timerInterval = null;
  document.querySelector('.mode-section')?.classList.remove('timer-on');
  document.getElementById('timer-bar-wrap')?.classList.remove('visible');
  const lbl = document.getElementById('timer-label');
  if (lbl) { lbl.classList.remove('visible','urgent'); }
}
function updateTimerDisplay() {
  const bar = document.getElementById('timer-bar');
  const cd  = document.getElementById('timer-countdown');
  const lbl = document.getElementById('timer-label');
  const total = AUTO_RESET_MS / 1000;
  const pct   = (timerSecondsLeft / total) * 100;
  if (bar) { bar.style.width = pct+'%'; bar.style.background = timerSecondsLeft <= 60 ? 'var(--danger)' : '#22C55E'; }
  if (cd) { const m=Math.floor(timerSecondsLeft/60),s=timerSecondsLeft%60; cd.textContent = m>0?m+' min '+s+' sek':s+' sek'; }
  if (lbl) lbl.classList.toggle('urgent', timerSecondsLeft <= 60);
}

// ════════════════════════════════
//  LÄGESHANTERING
// ════════════════════════════════
function setMode(mode) {
  if (currentMode === 'inv' && mode !== 'inv' && Object.keys(inventory).length > 0) {
    if (!confirm('Avbryta pågående inventering?')) return;
    inventory = {};
  }
  currentMode = mode;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  const btn = document.querySelector('.mode-btn.mode-' + mode);
  if (btn) btn.classList.add('active');
  const ind = document.getElementById('k-mode-indicator');
  if (ind) ind.className = 'mode-indicator ' + mode;
  const hints = { out:'Uttag — skanna en artikel', add:'Addera — skanna för att fylla på', inv:'Inventering — skanna varje artikel du räknar' };
  const hint = document.getElementById('mode-hint');
  if (hint) hint.textContent = hints[mode];
  const invPanel = document.getElementById('inv-panel');
  if (invPanel) invPanel.style.display = mode === 'inv' ? 'block' : 'none';
  showIdle();
  if (mode === 'add') startAutoReset();
  else { clearTimeout(autoResetTimer); hideTimer(); }
  focusInput();
}

// ════════════════════════════════
//  FEEDBACK
// ════════════════════════════════
let feedbackTimer = null;
function showIdle() {
  clearTimeout(feedbackTimer);
  const card = document.getElementById('feedback-card');
  const hints = { out:'Uttag — skanna en artikel', add:'Addera — skanna för att fylla på', inv:'Inventering — skanna varje artikel du räknar' };
  card.className = 'feedback-card';
  card.innerHTML = `
    <div class="idle-icon-wrap">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none">
        <rect x="3" y="3" width="3" height="12" rx="0.5" fill="#9e9b96" opacity=".9"/>
        <rect x="7.5" y="3" width="1.5" height="12" rx="0.5" fill="#9e9b96" opacity=".6"/>
        <rect x="10.5" y="3" width="2" height="12" rx="0.5" fill="#9e9b96" opacity=".8"/>
        <rect x="14" y="3" width="1" height="12" rx="0.5" fill="#9e9b96" opacity=".5"/>
        <rect x="16.5" y="3" width="2.5" height="12" rx="0.5" fill="#9e9b96" opacity=".7"/>
      </svg>
    </div>
    <div class="idle-text">Redo att skanna</div>
    <div class="idle-hint">${hints[currentMode]}</div>`;
}
function showFeedback(type, icon, name, msg, qty) {
  clearTimeout(feedbackTimer);
  const card = document.getElementById('feedback-card');
  card.className = 'feedback-card ' + type;
  let qtyHtml = '';
  if (qty !== null && qty !== undefined) {
    const cls = qty === 0 ? 'danger' : qty <= 3 ? 'warn' : 'ok';
    qtyHtml = `<div class="feedback-qty ${cls}">${qty}</div><div class="feedback-qty-label">st kvar i lager</div>`;
  }
  card.innerHTML = `<div class="feedback-icon">${icon}</div><div class="feedback-name">${esc(name)}</div>${qtyHtml}<div class="feedback-msg">${esc(msg)}</div>`;
  feedbackTimer = setTimeout(showIdle, 4000);
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// Skanningsfokus och tangentbordskil sköts av scan-wedge (initScanWedge).
function kioskScanContext() {
  const input = document.getElementById('barcode-input');
  const scanActive = !!document.getElementById('screen-scan')?.classList.contains('active');
  const modalOpen = Array.prototype.some.call(document.querySelectorAll('.modal-overlay'), (el) => {
    const d = el.style && el.style.display;
    return !!(d && d !== 'none');
  });
  return ScannyScan.contextFromActiveElement(document.activeElement, input, scanActive, modalOpen);
}
function focusInput() {
  if (scanWedge) { scanWedge.refocus(); return; }
  if (!document.getElementById('screen-scan')?.classList.contains('active')) return;
  document.getElementById('barcode-input')?.focus();
}
function toggleScanKeyboard() {
  if (!scanWedge) return;
  const on = !scanWedge.isManual();
  scanWedge.setManual(on);
  const btn = document.getElementById('keyboard-toggle');
  if (!btn) return;
  btn.setAttribute('aria-pressed', on ? 'true' : 'false');
  btn.classList.toggle('active', on);
  btn.textContent = on ? 'Dölj tangentbord' : 'Tangentbord';
}
function initScanWedge() {
  if (!window.ScannyScan || scanWedge) return;
  scanWedge = ScannyScan.attachScanWedge({
    getInput: () => document.getElementById('barcode-input'),
    getContext: kioskScanContext,
    onScan: (value) => scanProduct(value)
  });
}

// ════════════════════════════════
//  SKANNING
// ════════════════════════════════
let lastScanAt = 0;
function scanProduct(code) {
  lastScanAt = Date.now();
  const c = String(code || '').trim();
  if (!scanDedupe.accept(c, Date.now())) return;
  const mode = currentMode;
  resetLogoutTimer();
  if (mode === 'add') startAutoReset();
  const fbGen = ++scanFeedbackGen;
  const local = (db.products || []).find(x => x.code === c);

  if (mode === 'inv') {
    if (!local) { soundError(); showFeedback('err','✗','Okänd streckkod', c, null); return; }
    if (!inventory[local.id]) inventory[local.id] = { id: local.id, name: local.name, code: local.code, previous: local.qty, scanned: 0 };
    inventory[local.id].scanned++;
    soundSuccess();
    showFeedback('ok','📋', local.name, 'Inventering', inventory[local.id].scanned);
    renderInvList();
    return;
  }

  const plan = pendingQty.preview(local, mode);
  if (plan.status === 'ok') {
    soundSuccess();
    if (mode === 'add') showFeedback('ok','📥', plan.name, 'Påfyllning registrerad', plan.qty);
    else showFeedback('ok','✓', plan.name, 'Uttag registrerat', plan.qty);
  } else if (plan.status === 'empty') {
    soundError();
    showFeedback('err','✗', plan.name, 'Slut på lager', null);
  } else {
    playTone(660, .05, 'sine', .12);
    showFeedback('pending','…', 'Skannar', c, null);
  }

  const delta = plan.delta || 0;
  const endpoint = mode === 'add' ? '/api/add' : '/api/scan';
  scanQueue.enqueue(c, async () => {
    let settled = false;
    const settleOnce = () => {
      if (settled || !delta) return;
      settled = true;
      pendingQty.settle(c, delta);
    };
    try {
      const res = await api('POST', endpoint, { code: c, actorId: currentUser?.id });
      settleOnce();
      if (!res || !res.product) return;
      const p = res.product;
      if (mode === 'out' && currentVehicle) {
        const prod = (db.products || []).find(x => x.code === c) || (db.products || []).find(x => x.name === p.name);
        api('POST', '/api/vehicles/' + currentVehicle.id + '/log', {
          productName: p.name,
          qty: 1,
          userName: currentUser?.name || '—',
          articleNo: prod?.articleNo || '—',
          supplier: prod?.supplier || '—'
        }).catch(() => {});
      }
      applyProductUpdate(p);
      if (fbGen === scanFeedbackGen) {
        const same = plan.status === 'ok' && p.qty === plan.qty;
        if (mode !== 'add' && res.criticalAlert) {
          soundCritical();
          showFeedback('err','🚨', p.name, 'KRITISKT LAGER — varning skickad!', p.qty);
        } else if (mode !== 'add' && res.orderCreated) {
          soundWarning();
          showFeedback('warn','⚠', p.name, 'Lagd i beställningskö', p.qty);
        } else if (!same) {
          if (plan.status !== 'ok') soundSuccess();
          if (mode === 'add') showFeedback('ok','📥', p.name, 'Påfyllning registrerad', p.qty);
          else showFeedback('ok','✓', p.name, 'Uttag registrerat', p.qty);
        }
      } else if (res.criticalAlert) {
        soundCritical();
      }
      scheduleSync();
    } catch (err) {
      settleOnce();
      const msg = err && err.message ? err.message : 'Serverfel';
      if (msg.startsWith('Okänd streckkod')) {
        if (fbGen === scanFeedbackGen) { soundError(); showAddUnknown(c); }
      } else if (fbGen === scanFeedbackGen) {
        if (plan.status !== 'empty') soundError();
        showFeedback('err','✗','Fel', msg, null);
      }
    }
  }).catch(() => {});
}

// ════════════════════════════════
//  OKÄND STRECKKOD
// ════════════════════════════════
function showAddUnknown(code) {
  document.getElementById('unknown-code-display').textContent = code;
  document.getElementById('unknown-code-value').value = code;
  ['unknown-name','unknown-article','unknown-supplier'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('unknown-qty').value = '1';
  document.getElementById('unknown-min').value = '5';
  document.getElementById('unknown-critical').value = '2';
  document.getElementById('unknown-order-qty').value = '10';
  document.getElementById('unknown-modal').style.display = 'flex';
  setTimeout(() => document.getElementById('unknown-name').focus(), 100);
}
function closeUnknownModal() { document.getElementById('unknown-modal').style.display = 'none'; focusInput(); }
async function saveUnknownProduct() {
  const body = {
    name:     document.getElementById('unknown-name').value.trim(),
    code:     document.getElementById('unknown-code-value').value.trim(),
    qty:      parseInt(document.getElementById('unknown-qty').value)||0,
    min:      parseInt(document.getElementById('unknown-min').value)||5,
    critical: parseInt(document.getElementById('unknown-critical').value)||2,
    orderQty: parseInt(document.getElementById('unknown-order-qty').value)||10,
    articleNo: document.getElementById('unknown-article').value.trim(),
    supplier:  document.getElementById('unknown-supplier').value.trim()
  };
  if (!body.name) { document.getElementById('unknown-name').focus(); return; }
  try { await api('POST','/api/products',body); closeUnknownModal(); soundSuccess(); showFeedback('ok','✓',body.name,'Produkt tillagd!',body.qty); await loadDb(); }
  catch(err) { soundError(); alert('Fel: '+err.message); }
}
document.getElementById('unknown-modal').addEventListener('keydown', e => { if(e.key==='Enter'&&e.target.tagName==='INPUT') saveUnknownProduct(); if(e.key==='Escape') closeUnknownModal(); });

// ════════════════════════════════
//  INVENTERING
// ════════════════════════════════
function renderInvList() {
  const list = document.getElementById('k-inv-list'), sum = document.getElementById('k-inv-summary');
  const entries = Object.values(inventory);
  if (!list) return;
  if (entries.length === 0) { list.innerHTML=''; if(sum) sum.textContent='Skanna artiklar...'; return; }
  const diffs = entries.map(e=>e.scanned-e.previous);
  if (sum) sum.textContent = entries.length+' artiklar · '+diffs.filter(d=>d!==0).length+' differenser';
  list.innerHTML = entries.sort((a,b)=>a.name.localeCompare(b.name,'sv')).map(e=>{
    const d=e.scanned-e.previous, ds=d>0?'+'+d:''+d, dc=d>0?'pos':d<0?'neg':'zero';
    return `<div class="inv-row"><div><div class="inv-name">${esc(e.name)}</div><div class="inv-diff ${dc}">System:${e.previous} → Räknat:${e.scanned} (${ds})</div></div><div class="inv-count">${e.scanned}</div></div>`;
  }).join('');
}
function resetInventory() { if(!confirm('Rensa inventeringen?')) return; inventory={}; renderInvList(); showIdle(); }
async function finishInventory() {
  const entries = Object.values(inventory);
  if (entries.length===0) { alert('Inga artiklar skannade.'); return; }
  const diffs = entries.filter(e=>e.scanned!==e.previous);
  if (diffs.length===0) { soundSuccess(); showFeedback('ok','✓','Inventering klar!','Ingen differens',null); inventory={}; renderInvList(); setMode('out'); return; }
  if (!confirm('Avsluta inventering? ('+diffs.length+' differenser)')) return;
  for (const e of entries) { try { await api('PATCH','/api/products/'+e.id,{qty:e.scanned}); } catch(_){} }
  try { await api('POST','/api/inventory-report',{entries, actorId: currentUser?.id}); } catch(_){}
  await loadDb(); soundSuccess(); showFeedback('ok','✓','Inventering klar!',diffs.length+' differenser uppdaterade',null);
  inventory={}; renderInvList(); setMode('out');
}

let seenAppVersion = null;
function kioskReloadContext(version) {
  const modalOpen = Array.prototype.some.call(document.querySelectorAll('.modal-overlay'), (el) => {
    const d = el.style && el.style.display;
    return !!(d && d !== 'none');
  });
  const active = document.activeElement;
  const scan = document.getElementById('barcode-input');
  return {
    version: version,
    seen: seenAppVersion,
    modalOpen: modalOpen,
    focusedTag: active && active.tagName,
    focusedId: active && active.id,
    manualKeyboard: !!(scan && scan.classList.contains('manual-keyboard')),
    lastScanAt: lastScanAt,
    now: Date.now(),
    scanValue: scan ? scan.value : ''
  };
}
async function pollKioskVersion() {
  if (!window.ScannyUpdate) return;
  try {
    const res = await fetch('/api/version', { cache: 'no-store' });
    if (!res.ok) return;
    const data = await res.json();
    if (!data || !data.version) return;
    if (!seenAppVersion) { seenAppVersion = data.version; return; }
    if (ScannyUpdate.shouldReload(kioskReloadContext(data.version))) location.reload();
  } catch (_) {}
}

// ── Start ──
initScanWedge();
initKiosk();
setInterval(loadDb, 15000);
if (window.ScannyUpdate) {
  ScannyUpdate.bindModalViewport();
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') pollKioskVersion();
  });
  setInterval(pollKioskVersion, ScannyUpdate.POLL_MS);
  pollKioskVersion();
}
