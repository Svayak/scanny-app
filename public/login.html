<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logga in — Scanny</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c0f0a;--surface:#141810;--surface2:#1c2118;
  --border:#2a3025;--border2:#3a4535;
  --text:#f0ede8;--text2:#9fa899;--text3:#6b7265;
  --accent:#4ade80;--accent2:#22c55e;
  --danger:#f87171;
  --radius:10px;--radius-lg:16px;
}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--text);
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:24px;
}
body::before{
  content:'';position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events:none;z-index:0;opacity:.35;
}
.login-box{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:40px;
  width:100%;max-width:400px;position:relative;z-index:1;
}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:32px;justify-content:center}
.brand-icon{
  width:36px;height:36px;background:var(--accent);border-radius:8px;
  display:flex;align-items:center;justify-content:center;
}
.brand-name{font-size:22px;font-weight:800;color:var(--text);letter-spacing:-.3px}
h1{font-size:20px;font-weight:700;margin-bottom:6px;text-align:center}
.subtitle{font-size:14px;color:var(--text2);text-align:center;margin-bottom:28px}
.form-group{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.form-group label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text3)}
.form-group input{
  padding:12px 14px;background:var(--surface2);border:1px solid var(--border2);
  border-radius:var(--radius);color:var(--text);font-size:15px;outline:none;
  transition:border-color .2s;font-family:inherit;
}
.form-group input:focus{border-color:var(--accent)}
.form-group input::placeholder{color:var(--text3)}
.btn-login{
  width:100%;padding:13px;background:var(--accent);color:#0c0f0a;
  border:none;border-radius:var(--radius);font-size:15px;font-weight:700;
  cursor:pointer;transition:all .2s;font-family:inherit;margin-top:8px;
}
.btn-login:hover{background:var(--accent2)}
.btn-login:disabled{opacity:.6;cursor:not-allowed}
.error-msg{
  background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.25);
  border-radius:var(--radius);padding:10px 14px;font-size:13px;color:var(--danger);
  margin-bottom:16px;display:none;
}
.back-link{display:block;text-align:center;margin-top:20px;font-size:13px;color:var(--text3);text-decoration:none;transition:color .2s}
.back-link:hover{color:var(--accent)}
</style>
</head>
<body>
<div class="login-box">
  <div class="brand">
    <div class="brand-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <rect x="3" y="3" width="3" height="12" rx="0.5" fill="#0c0f0a" opacity=".9"/>
        <rect x="7.5" y="3" width="1.5" height="12" rx="0.5" fill="#0c0f0a" opacity=".6"/>
        <rect x="10.5" y="3" width="2" height="12" rx="0.5" fill="#0c0f0a" opacity=".8"/>
        <rect x="14" y="3" width="1" height="12" rx="0.5" fill="#0c0f0a" opacity=".5"/>
        <rect x="16.5" y="3" width="2.5" height="12" rx="0.5" fill="#0c0f0a" opacity=".7"/>
      </svg>
    </div>
    <div class="brand-name">Scanny</div>
  </div>

  <h1>Välkommen tillbaka</h1>
  <p class="subtitle">Logga in på din verkstads adminpanel</p>

  <div class="error-msg" id="error-msg"></div>

  <form id="login-form" onsubmit="handleLogin(event)">
    <div class="form-group">
      <label>E-post</label>
      <input type="email" id="email" placeholder="din@verkstad.se" required autofocus>
    </div>
    <div class="form-group">
      <label>Lösenord</label>
      <input type="password" id="password" placeholder="••••••••" required>
    </div>
    <button type="submit" class="btn-login" id="login-btn">Logga in</button>
  </form>

  <a href="/" class="back-link">← Tillbaka till scanny.se</a>
</div>

<script>
// Om redan inloggad — skicka till appen
if (localStorage.getItem('scanny_token')) {
  window.location.href = '/';
}

async function handleLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('login-btn');
  const errorEl = document.getElementById('error-msg');
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  btn.textContent = 'Loggar in...';
  btn.disabled = true;
  errorEl.style.display = 'none';

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Inloggning misslyckades');
    localStorage.setItem('scanny_token', data.token);
    localStorage.setItem('scanny_user', JSON.stringify(data.user));
    localStorage.setItem('scanny_slug', data.tenant.slug);
    window.location.href = '/' + data.tenant.slug;
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.style.display = 'block';
    btn.textContent = 'Logga in';
    btn.disabled = false;
  }
}
</script>
</body>
</html>
